<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Game iOS Style</title>
    <style>
        body {
            background: linear-gradient(135deg, #f5f5f7, #e0e0f8);
            font-family: "great vibes";
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            transition: background 0.5s ease;
        }

        input {
            width: 200px;
            height: 40px;
            font-size: 20px;
            border-radius: 12px;
            border: 2px solid #ccc;
            margin: 10px;
            padding: 5px 10px;
            text-align: center;
            transition: all 0.3s ease;
            text-transform: capitalize;
        }

        input:focus {
            outline: none;
            border-color: #007aff;
            box-shadow: 0 0 10px rgba(0, 122, 255, 0.5);
        }

        button {
            height: 80px;
            width: 250px;
            margin-top: 20px;
            background: linear-gradient(45deg, #007aff, #5ac8fa);
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: 700;
            font-size: 26px; /* iOS 26 */
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        button:hover,
        button:focus {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(0, 122, 255, 0.6);
            outline: none;
        }

        .dice-container {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-top: 30px;
        }

        .player {
            text-align: center;
        }

        .dice {
            width: 80px;
            height: 80px;
            font-size: 26px;
            font-weight: 700;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 5px;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dice:hover,
        .dice:focus {
            transform: scale(1.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 15px rgba(0, 122, 255, 0.5);
            outline: none;
        }

        .dice.animate {
            animation: roll 0.5s ease forwards;
        }

        @keyframes roll {
            0% {
                transform: rotate(0deg) scale(1);
                background: linear-gradient(145deg, #fff, #e0e0e0);
            }

            50% {
                transform: rotate(360deg) scale(1.2);
                background: linear-gradient(145deg, #a0e0ff, #c0f0ff);
            }

            100% {
                transform: rotate(0deg) scale(1);
                background: linear-gradient(145deg, #fff, #e0e0e0);
            }
        }

        .msg {
            font-size: 26px;
            font-weight: 600;
            margin-top: 20px;
            text-align: center;
            width: 400px;
            transition: all 0.5s ease;
        }

        .score {
            width: 200px;
            height: 60px;
            font-size: 26px;
            font-weight: 700;
            border-radius: 20px;
            text-align: center;
            line-height: 60px;
            background: linear-gradient(145deg, #f9f9f9, #e0e0e0);
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            margin: 10px 0;
        }

        .score:hover,
        .score:focus {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 10px rgba(0, 122, 255, 0.5);
            outline: none;
        }

        label {
            font-weight: 600;
            font-size: 22px;
        }
    </style>
</head>

<body>
    <div>
        <input type="text" id="player1" placeholder="Player 1 Name" value="Player1">
        <input type="text" id="player2" placeholder="Player 2 Name" value="Player2">
    </div>

    <button onclick="roll()" id="btn">ROLL</button>

    <div class="msg" id="msg">Player1’s Turn</div>

    <div class="dice-container">
        <div class="player">
            <h3 id="nameO">Player1</h3>
            <div id="o1" class="dice" tabindex="0">0</div>
            <div id="o2" class="dice" tabindex="0">0</div>
        </div>

        <div class="player">
            <h3 id="nameR">Player2</h3>
            <div id="r1" class="dice" tabindex="0">0</div>
            <div id="r2" class="dice" tabindex="0">0</div>
        </div>
    </div>

    <div>
        <label id="labelR">Player2 score:</label>
        <div id="sr" class="score" tabindex="0">0</div>

        <label id="labelO">Player1 score:</label>
        <div id="so" class="score" tabindex="0">0</div>
    </div>

    <script>
        let scoreO = 0;
        let scoreR = 0;
        let turnOmar = true;

        const player1Input = document.getElementById("player1");
        const player2Input = document.getElementById("player2");
        const nameO = document.getElementById("nameO");
        const nameR = document.getElementById("nameR");
        const labelO = document.getElementById("labelO");
        const labelR = document.getElementById("labelR");
        const msg = document.getElementById("msg");

        function roll() {
            // update names dynamically
            const p1 = player1Input.value || "Player 1";
            const p2 = player2Input.value || "Player 2";

            nameO.textContent = p1;
            nameR.textContent = p2;
            labelO.textContent = `${p1} score:`;
            labelR.textContent = `${p2} score:`;

            // generate dice
            let dice1 = Math.floor(Math.random() * 6) + 1;
            let dice2 = Math.floor(Math.random() * 6) + 1;

            let d1, d2;

            if (turnOmar) {
                d1 = document.getElementById("o1");
                d2 = document.getElementById("o2");
            } else {
                d1 = document.getElementById("r1");
                d2 = document.getElementById("r2");
            }

            // animation
            d1.classList.remove("animate");
            d2.classList.remove("animate");
            void d1.offsetWidth;
            void d2.offsetWidth;
            d1.classList.add("animate");
            d2.classList.add("animate");

            setTimeout(() => {
                d1.innerHTML = dice1;
                d2.innerHTML = dice2;
            }, 250);

            let sum = dice1 + dice2;

            if (turnOmar) {
                scoreO += sum;
                document.getElementById("so").innerHTML = scoreO;
                msg.innerHTML = `${p1} rolled ${dice1} + ${dice2} = ${sum}<br>${p2}’s Turn`;
                turnOmar = false;
            } else {
                scoreR += sum;
                document.getElementById("sr").innerHTML = scoreR;
                msg.innerHTML = `${p2} rolled ${dice1} + ${dice2} = ${sum}<br>${p1}’s Turn`;
                turnOmar = true;
            }

            if (scoreO >= 200) {
                msg.innerHTML = `🏆 ${p1} WINS THE GAME!`;
                document.getElementById("btn").disabled = true;
            } else if (scoreR >= 200) {
                msg.innerHTML = `🏆 ${p2} WINS THE GAME!`;
                document.getElementById("btn").disabled = true;
            }
        }
    </script>
</body>

</html>
