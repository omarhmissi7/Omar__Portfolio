<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

body{
    background:#111;
    font-family:Arial;
}

center{
    margin-top:150px;
}

/* input style */

input{
    padding:12px;
    border-radius:10px;
    border:none;
    font-size: 25px;
    color:rgb(0, 0, 0);
    text-align:center;
    font-weight: 900;

    
}
div{
    border: 3px solid white;
    height: 60px;
    width: 290px;
    padding-top: 30px;
    color: white;
    font-weight: 900;
    font-size: 20px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;

}

/* button style */

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    color:white;
    cursor:pointer;

    background:linear-gradient(270deg,#ff0000,#ff7300,#fffb00,#48ff00,#00ffd5,#002bff,#7a00ff,#ff00c8);
    background-size:600% 600%;

    animation: moveColors 6s ease infinite;
    transition:0.3s;
}

button:hover{
    
}

/* animation */

@keyframes moveColors{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}
button:active{
    transform: scale(0.925);
}
</style>
<body>
    <center>
        <button onclick="gen()">
            GENERATE NUMBER
        </button><br><br><br>
        <input type="number" name="" id="num"><br><br><br>
        <button onclick="ver()">VERIFY</button><br><br><br>
        <div id="result">

        </div>

    </center>
</body>
<script>
    var goal;
    function gen(){
        goal = Math.floor(Math.random() * 100 ) + 1;

    }
    let att = 0
    function ver(){
        att++;
        let num = document.getElementById("num").value;
        let result = document.getElementById("result");
        if ( goal > num){
            result.innerHTML = "BIGGER"
        }else if( num > goal){
            result.innerHTML = "LOWER"
        }else{
            result.innerHTML = "YOU GET IT IN " + att + " ATTEMPS"
        }

    }
</script>
</html>
